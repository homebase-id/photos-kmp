name: iosApp
options:
  bundleIdPrefix: id.homebase
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # gradle (the framework build script) needs filesystem access outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      # Recursive: XcodeGen expands this dir to every .swift it contains, including
      # iosApp/timeline/ (TimelineView.swift, ThumbnailLoader.swift) and ContentView/iOSApp.
      - path: iosApp
      - path: Theme
    # A real Info.plist (not INFOPLIST_KEY_* build settings): the background-backup keys are
    # arrays (UIBackgroundModes, BGTaskSchedulerPermittedIdentifiers) which need a plist. The
    # former INFOPLIST_KEY_* scalars (display name, portrait lock, launch screen) migrate here.
    # XcodeGen generates iosApp/Info.plist from this on `xcodegen generate`.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Homebase Photos
        UILaunchScreen: {}
        # Portrait lock (owner directive) — iPhone never rotates.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: Homebase Photos backs up your photos and videos to your own Homebase drive.
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - id.homebase.photos.backup        # BGProcessingTask — opportunistic auto/periodic
          - id.homebase.photos.backup.now    # BGContinuedProcessingTask — user-initiated, survives backgrounding
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.homebase.photos
        # NO: an explicit Info.plist (info block) owns the keys; avoids a synthesize/merge conflict.
        GENERATE_INFOPLIST_FILE: NO
        # Where embedAndSignAppleFrameworkForXcode drops Shared.framework per CONFIGURATION/SDK.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
          # Static Shared.framework re-exports its sqliter cinterop symbols; link system SQLite.
          - "-lsqlite3"
    preBuildScripts:
      - name: Build Shared.framework (gradle)
        # Runs from the Xcode build phase so it inherits CONFIGURATION/SDK_NAME/ARCHS/etc.
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      # Recursive: includes MainFlowUITest.swift + TimelineGridUITest.swift.
      - path: iosAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.homebase.photos.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: iosApp

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppUITests
