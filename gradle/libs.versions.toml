[versions]
agp = "9.2.1"
android-compileSdk = "36"
android-minSdk = "28"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-browser = "1.10.0"
# AndroidX (platform) Compose for the native androidApp — BOM pins ui/material3/test versions.
androidx-composeBom = "2026.06.00"
androidx-core = "1.18.0"
androidx-espresso = "3.7.0"
androidx-exifinterface = "1.4.2"
androidx-lifecycle = "2.10.0"
# AndroidX (platform) lifecycle for the native androidApp's Compose collectAsStateWithLifecycle / viewModel().
androidx-lifecyclePlatform = "2.10.0"
androidx-media3 = "1.10.0"
androidx-navigationCompose = "2.9.6"
androidx-splashscreen = "1.0.1"
androidx-testCore = "1.7.0"
androidx-testExt = "1.3.0"
androidx-testRunner = "1.7.0"
androidx-work = "2.10.1"
atomicfu = "0.32.1"
# Compose Multiplatform — used HERE only as a LIBRARY for data types the copied protocol
# layer references (@Immutable, ImageBitmap / asImageBitmap / toComposeImageBitmap). NOT shared
# Compose UI screens. Pinned to chat-kmp's value.
composeMultiplatform = "1.10.3"
coil3 = "3.4.0"
telephoto = "0.16.0"
cryptography = "0.5.0"
ffmpegKit = "1.0"
filekit = "0.13.0"
junit = "4.13.2"
kermit = "2.1.0"
kotlin = "2.3.21"
kotlin-immutable-collections = "0.4.0"
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.7.1"
kotlinx-io = "0.9.0"
kotlinxSerializationJson = "1.11.0"
koin = "4.2.1"
ktor = "3.4.3"
metadataExtractor = "2.19.0"
mp4parser = "1.9.39"
okio = "3.17.0"
# SKIE (net-new). 0.10.12 (2026-05-18) adds Kotlin 2.3.21 support — keep in lockstep with the kotlin pin.
skie = "0.10.12"
sqlcipher = "4.13.0"
sqldelight = "2.3.2"
sqlite-jdbc-crypt = "3.51.2.0"

[libraries]
# --- common (shared protocol layer) ---
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
coil3 = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil3" }
# Coil 3 Compose integration (AsyncImage) — the androidApp grid renders thumbnails through it,
# backed by an ImageLoader wired with the shared HomebaseImageFetcher/Keyer. No coil-network
# artifact: bytes come from DriveFileProvider via the custom Fetcher, not Coil's HTTP stack.
coil3-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3" }
telephoto-zoomable-image-coil3 = { module = "me.saket.telephoto:zoomable-image-coil3", version.ref = "telephoto" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-immutableCollections = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlin-immutable-collections" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
# JetBrains KMP lifecycle ViewModel base (Compose-free) — the headless shared ViewModel parent.
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
# Compose-as-a-library: data types referenced by the copied protocol layer (ImageBitmap, @Immutable).
jetbrains-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
jetbrains-compose-ui-graphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "composeMultiplatform" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
# CommonMark AST parser used by MarkdownPlain/MarkdownLineBreaks (org.intellij.markdown.*).
jetbrains-markdown = { module = "org.jetbrains:markdown", version = "0.7.3" }

# --- ktor ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# JVM-only: the desktop YouAuth redirect callback server (LocalCallbackServer.kt). JVM is a
# unit-test target here, not a product target.
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }

# --- sqldelight ---
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-sqlite338-dialect = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
sqlite-jdbc-crypt = { module = "io.github.willena:sqlite-jdbc", version.ref = "sqlite-jdbc-crypt" }
android-database-sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

# --- koin ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# --- androidApp native Compose (platform AndroidX, NOT the JetBrains KMP compose above) ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# Material icons — extended set. AccountCircle isn't in material-icons-core, so we take the full
# extended artifact (larger binary) rather than hand-draw glyphs. BOM-pinned, no explicit version.
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# Platform AndroidX lifecycle for native Android: viewModel() + collectAsStateWithLifecycle().
# Distinct alias prefix from the JetBrains KMP lifecycle entries above to avoid accessor clashes.
androidx-composeLifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecyclePlatform" }
androidx-composeLifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecyclePlatform" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
# Real router / back-stack for the native Android shell (A1). String-route NavHost — no kotlinx
# type-safe nav, so androidApp keeps out of the serialization plugin.
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigationCompose" }
# Android 12+ cold-start splash backport (A3). Provides Theme.SplashScreen + windowSplashScreen* attrs.
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }

# --- android ---
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "androidx-browser" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidx-media3" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "androidx-media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "androidx-media3" }
ffmpeg-kit = { module = "id.homebase.libs:ffmpeg-kit", version.ref = "ffmpegKit" }
smart-exception-java = { module = "com.arthenica:smart-exception-java", version = "0.2.1" }
mp4parser-isoparser = { module = "org.mp4parser:isoparser", version.ref = "mp4parser" }
androidsvg = { module = "com.caverock:androidsvg-aar", version = "1.4" }
metadata-extractor = { module = "com.drewnoakes:metadata-extractor", version.ref = "metadataExtractor" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }

# --- test ---
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-testRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-testCore" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
